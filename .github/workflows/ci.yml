name: AegisVault CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    name: Test & Build Smart Contracts, ZK Engine & Frontend

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Contract & Validate Managed Artifacts
        run: npm run build --workspace=contract

      - name: Run Automated Test Suite (8 Passing ZK Invariant Tests)
        run: npm test

      - name: Typecheck Frontend
        run: npm run lint --workspace=frontend

      - name: Build Frontend for Production (Vite)
        run: npm run build --workspace=frontend
